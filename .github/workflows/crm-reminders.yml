name: CRM Reminder Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: crm-reminder-scheduler
  cancel-in-progress: false

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger secure CRM reminder scan
        env:
          REMINDER_URL: https://www.texwebsolution.in/api/notifications/reminders
        run: |
          set -euo pipefail
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=texweb-crm-reminders"
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${token_url}" | jq -r '.value')"
          test -n "${oidc_token}"
          test "${oidc_token}" != "null"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            -H "Authorization: Bearer ${oidc_token}" \
            "${REMINDER_URL}"
